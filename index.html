    <meta name="theme-color" content="#FFFFFF" />

    <!--
      Tema: o claro é o padrão. Este script roda ANTES do CSS e do React,
      de forma síncrona, para aplicar o tema salvo já no primeiro paint —
      sem ele o visitante que escolheu o escuro veria um flash branco.
      Mantenha inline e no topo do <head>.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('integracao-tema') === 'escuro') {
            document.documentElement.setAttribute('data-tema', 'escuro')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0A0A0A')
          }
        } catch (e) {
          /* localStorage bloqueado — segue no tema claro */
        }
      })()
    </script>
